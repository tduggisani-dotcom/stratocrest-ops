<!doctype html>
<!--
  StratoCrest Ops sign-in email: Supabase Auth's "Magic link" template.
  Local: supabase/config.toml [auth.email.template.magic_link] (restart the stack after edits).
  Hosted: paste this file into Authentication > Emails > Magic link, subject
  "Your StratoCrest Ops sign-in code".

  Link scheme (keep in sync with confirmRedirectUrl() in src/lib/schemas/auth.ts):
  - The app calls signInWithOtp with emailRedirectTo = <site>/auth/confirm?next=<encoded path>.
    Supabase puts that in the template as RedirectTo, so it always already has "?next=…".
  - The button appends "&token_hash=…&type=email" to it, giving
    <site>/auth/confirm?next=%2Ftasks&token_hash=…&type=email
  - /auth/confirm shows a "Sign in" button and verifies only when it is pressed, so email
    scanners that open links can't use up the sign-in.
  The site's address must be Supabase's Site URL or in its Redirect URLs; otherwise Supabase
  swaps in the Site URL, which has no "?next=", and the button breaks (the code still works).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Your StratoCrest Ops sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #0a0a0a;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f5f5f5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 440px;
              background-color: #ffffff;
              border: 1px solid #e5e5e5;
              border-radius: 12px;
            "
          >
            <tr>
              <td style="padding: 32px 28px">
                <p style="margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #3a58c3">
                  StratoCrest Ops
                </p>
                <h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.3; color: #0a0a0a">
                  Your sign-in code
                </h1>
                <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.5">
                  Type this code on the sign-in page:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 14px 0;
                    background-color: #f5f5f5;
                    border-radius: 8px;
                    text-align: center;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                    font-size: 34px;
                    font-weight: 700;
                    letter-spacing: 8px;
                    color: #0a0a0a;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.5">
                  Or, on the device you want to use, press this button:
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
                    style="
                      display: inline-block;
                      padding: 12px 20px;
                      background-color: #3a58c3;
                      color: #ffffff;
                      font-size: 16px;
                      font-weight: 600;
                      text-decoration: none;
                      border-radius: 8px;
                    "
                    >Sign in to StratoCrest Ops</a
                  >
                </p>
                <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: #5c5c5c">
                  The code and the button work once and expire in 1 hour.
                </p>
                <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5c5c5c">
                  If you didn't try to sign in, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
